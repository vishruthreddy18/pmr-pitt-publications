# Pulls fresh data from Scopus and commits it if anything changed.
# The commit to main makes GitHub Pages republish the site.
name: Sync Scopus data

on:
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  # Step 5: uncomment to run nightly. 07:15 UTC = 2:15 AM EST / 3:15 AM EDT.
  # schedule:
  #   - cron: "15 7 * * *"

permissions:
  contents: write             # lets the job push the data commit

concurrency:
  group: scopus-sync          # never run two syncs at once
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r sync/requirements.txt

      # Exits non-zero (and writes nothing) on Scopus errors or suspicious counts,
      # so the commit step below never runs and the last good data stays live.
      - name: Sync from Scopus
        run: python sync/sync.py
        env:
          SCOPUS_API_KEY: ${{ secrets.SCOPUS_API_KEY }}
          SCOPUS_INSTTOKEN: ${{ secrets.SCOPUS_INSTTOKEN }}

      - name: Commit data if changed
        run: |
          if git diff --quiet -- data/; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Scopus sync $(date -u +%Y-%m-%d)"
          git push
