<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PM&amp;R Research Publications | University of Pittsburgh</title>
  <meta name="description" content="Research publications by University of Pittsburgh Physical Medicine & Rehabilitation faculty, sourced from Elsevier Scopus.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caladea:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="static/style.css">
  <script>
    // Apply a saved light/dark choice before the page paints (avoids a flash).
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <main class="card">
    <header class="masthead">
      <button type="button" id="theme-toggle" class="theme-toggle">
        <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M21 14.5A9 9 0 0 1 9.5 3a7.5 7.5 0 1 0 11.5 11.5z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 1.5v2.5M12 20v2.5M1.5 12H4M20 12h2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></g></svg>
      </button>
      <p class="institution">University of Pittsburgh - School of Medicine<br>Physical Medicine &amp; Rehabilitation</p>
      <h1>Research Publications</h1>
      <p class="note">The publications and metadata are obtained from the Elsevier Scopus Tool.</p>
    </header>

    <div class="body">
      <section class="stats" aria-label="Summary">
        <div class="stat"><span class="stat-value" id="stat-pubs">–</span><span class="stat-label">Publications</span></div>
        <div class="stat"><span class="stat-value" id="stat-cites">–</span><span class="stat-label">Citations</span></div>
        <div class="stat"><span class="stat-value" id="stat-faculty">–</span><span class="stat-label" id="stat-faculty-label">Faculty</span></div>
        <div class="stat"><span class="stat-value small" id="stat-updated">–</span><span class="stat-label">Last Updated</span></div>
      </section>

      <section class="toolbar">
        <div class="field">
          <label for="author">Author</label>
          <select id="author" disabled><option>Loading…</option></select>
        </div>
        <div class="field grow">
          <label for="search">Search</label>
          <input id="search" type="search" placeholder="Title, journal, or author" autocomplete="off">
        </div>
      </section>

      <section class="controls">
        <div class="control-group" role="group" aria-label="Sort by">
          <span class="control-label">Sort by:</span>
          <div class="segmented">
            <button type="button" data-sort="newest">Newest</button>
            <button type="button" data-sort="oldest">Oldest</button>
            <button type="button" data-sort="cited">Most Cited</button>
          </div>
        </div>
        <div class="control-group" role="group" aria-label="Items per page">
          <span class="control-label">Items per page:</span>
          <div class="segmented">
            <button type="button" data-size="5">5</button>
            <button type="button" data-size="10">10</button>
            <button type="button" data-size="20">20</button>
          </div>
        </div>
      </section>

      <p id="summary" class="summary" aria-live="polite"></p>
      <ol id="results" class="results"></ol>
      <nav id="pager" class="pager" aria-label="Pagination" hidden></nav>
    </div>
  </main>

  <footer class="site-footer">Developed by Vishruth Pradeep Reddy</footer>

  <script src="static/app.js"></script>
</body>
</html>
